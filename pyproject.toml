[project]
name = "derivados"
version = "1.0.0"
description = "Crédito en USD para maquinaria amarilla y cobertura con forwards de divisas COP/USD (informe interactivo con Plotly)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derivados"]

[tool.uv]
# Solo versiones publicadas al menos 7 días antes de la fecha de corte del análisis.
exclude-newer = "2026-10-08T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
# dict(...) es el estilo idiomático para configurar figuras de Plotly; por eso no se activa C408.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # etiquetas y textos largos en español dentro de gráficos y tablas

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
