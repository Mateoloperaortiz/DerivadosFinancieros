escenarios:
  descripcion: "TRM esperada a 12 meses (oct-2027) y deriva anual de largo plazo (años 2 a 10)"
  lista:
    - key: favorable
      nombre: "Favorable para el peso"
      trm_12m: 3050
      deriva_lp: 0.000
      probabilidad: 0.25
      narrativa: "Se produce un desescalamiento del conflicto en Medio Oriente, aunque el Brent se mantiene por encima de USD 85. El Congreso aprueba la Ley Fiscal con recortes creíbles que preservan la calificación soberana, el carry trade conserva su atractivo y la Reserva Federal hace una pausa en las alzas. En conjunto, el peso registra una apreciación real cercana a 1,5 % anual."
    - key: central
      nombre: "Central"
      trm_12m: 3400
      deriva_lp: 0.030
      probabilidad: 0.50
      narrativa: "Escenario considerado más probable: el peso corrige gradualmente hacia su valor de equilibrio ante el deterioro de las cuentas externa y fiscal, el precio del petróleo se normaliza (la EIA proyecta un Brent de USD 84 en 2027) y la Reserva Federal preserva una postura restrictiva, amortiguada parcialmente por el diferencial de tasas. En el largo plazo rige la paridad del poder adquisitivo en su forma relativa, más una prima de riesgo moderada."
    - key: adverso
      nombre: "Adverso (depreciación)"
      trm_12m: 3850
      deriva_lp: 0.070
      probabilidad: 0.25
      narrativa: "Se materializa un desvío fiscal severo, con un déficit superior a 8 % del PIB, acompañado de la pérdida del último grado de inversión, una caída acelerada del crudo hacia USD 70, dos incrementos adicionales de la tasa de la Reserva Federal y salidas significativas de capital de portafolio. La dinámica resultante reproduciría la depreciación persistente observada entre 2012 y 2022."
